[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-learning-loss"
version = "0.0.1"
authors = [
  { name = "Ryuto Yoshida" },
]
description = "Typed PyTorch loss functions grouped by what they compare, with a guide from learning task to suitable losses."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.8",
]

[project.urls]
Homepage = "https://github.com/ry-yoshida-dev/DeepLearningLoss"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/DeepLearningLoss/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deep_learning_loss = ["py.typed"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.mypy]
mypy_path = "src"
files = ["src", "tests"]
explicit_package_bases = true
strict = true
untyped_calls_exclude = ["torch._tensor", "torch.distributions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "basedpyright",
    "mypy",
    "numpy>=2.5.4",
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# Only public classes, methods, and functions need docstrings, and multi-line ones are the local style.
ignore = ["D100", "D104", "D105", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.uv]
exclude-newer = "7 days"
